<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和風系LP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================================
        ヘッダー
    ========================================== -->
    <header class="fv">
        <div class="fv-container">
            <div class="fv-imgbox">
                <img src="img/sweets.png" alt="抹茶生大福" class="fv-goods">
                <img src="img/seal.png" alt="ハンコ" class="fv-seal">
            </div>
            <div class="fv-textbox">
                <h2 class="fv-title">
                        極上抹茶生大福
                </h2>
                <p class="fv-text">
                        京都祇園菓匠 辻乃屋
                </p>
            </div>
        </div>
    </header>

    <!-- =========================================
        こだわり
    ========================================== -->
    <section class="concept">
        <div class="concept-container">
            <h2 class="concept-title">
                祇園の伝統が生み出す、至高の一粒
            </h2>
            <div class="concept-wrapper">
                <div class="concept-textbox">
                    <p class="concept-sub">
                        創業百余年、<br>
                        受け継がれてきた<br>
                        伝統の技
                    </p>
                    <p class="concept-text">
                        京都宇治の老舗茶問屋から特別に仕入れた希少な「一番摘み宇治抹茶」を100%使用。茶道でも用いられる上質な抹茶だけが持つ、深く豊かな香りと心地よいほろ苦さを、贅沢に閉じ込めました。
                    </p>
                </div>
                <div class="concept-imgbox">
                    <img src="img/image_0.png" alt="抹茶を点てる" class="concept-img">
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
